name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt requests
      - name: Run engine / honeytoken / registry / auth / evidence / migration tests
        run: |
          python -m pytest -q \
            scripts/test_mirage.py \
            scripts/test_honeytoken.py \
            scripts/test_honeytoken_integration.py \
            scripts/test_supabase_registry.py \
            scripts/test_server_auth.py \
            scripts/test_evidence_chain.py \
            scripts/mirage-edge/tests/test_migration.py

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run vitest
        run: npx vitest run

  edge:
    name: Edge function tests (deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run beacon-receiver + evidence chain tests
        env:
          DENO_TESTING: "1"
        run: |
          deno test --no-check --allow-net --allow-env --allow-read \
            scripts/mirage-edge/tests/beacon_receiver_test.ts \
            scripts/mirage-edge/tests/evidence_chain_test.ts

  e2e:
    name: End-to-end (Task 02 <-> Task 03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt requests
      - name: Run integration script
        env:
          MIRAGE_EVIDENCE_HMAC_KEY: e2e-local-evidence-key
        run: python scripts/test_e2e_mirage.py
